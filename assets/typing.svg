    </linearGradient>
  </defs>
  <rect width="1000" height="190" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="998" height="188" rx="15" fill="none" stroke="#2b5878" />
  <path d="M32 32 H968" stroke="#1d3c58" />
  <circle class="particle" cx="86" cy="58" r="1.5" style="animation-delay: 0.0s" />
  <circle class="particle" cx="144" cy="148" r="1.0" style="animation-delay: 1.2s" />
  <circle class="particle" cx="218" cy="74" r="1.2" style="animation-delay: 0.6s" />
  <circle class="particle" cx="306" cy="160" r="1.4" style="animation-delay: 1.8s" />
