<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Feynman - LLM Inference Engineer</title>
  <desc id="desc">Animated introduction for Feynman's GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdff" />
      <stop offset="1" stop-color="#f1f6fb" />
    </linearGradient>
  </defs>
  <rect width="1000" height="190" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="998" height="188" rx="15" fill="none" stroke="#d8e1eb" />
  <path d="M32 32 H968" stroke="#e5ebf2" />
  <style>
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', monospace; }
    .label { fill: #7b8794; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .message { fill: #17212b; font-size: 25px; font-weight: 600; }
  </style>
  <circle cx="40" cy="18" r="4" fill="#147efb" />
  <text class="label" x="54" y="22">LLM INFERENCE / PROFILE</text>
  <text class="label" x="960" y="22" text-anchor="end">FEYNMAN</text>
  <g>
    <clipPath id="typing-clip-0">
      <rect x="500" y="40" width="0" height="38">
        <animate attributeName="x" dur="8s" repeatCount="indefinite"
          values="500;500;32;32;500;500" keyTimes="0;0.0000;0.0813;0.8500;0.9500;1" />
        <animate attributeName="width" dur="8s" repeatCount="indefinite"
          values="0;0;936;936;0;0" keyTimes="0;0.0000;0.0813;0.8500;0.9500;1" />
      </rect>
    </clipPath>
    <clipPath id="typing-clip-1">
      <rect x="500" y="82" width="0" height="38">
        <animate attributeName="x" dur="8s" repeatCount="indefinite"
          values="500;500;32;32;500;500" keyTimes="0;0.1875;0.2687;0.8500;0.9500;1" />
        <animate attributeName="width" dur="8s" repeatCount="indefinite"
          values="0;0;936;936;0;0" keyTimes="0;0.1875;0.2687;0.8500;0.9500;1" />
      </rect>
    </clipPath>
    <clipPath id="typing-clip-2">
      <rect x="500" y="124" width="0" height="38">
        <animate attributeName="x" dur="8s" repeatCount="indefinite"
          values="500;500;32;32;500;500" keyTimes="0;0.3750;0.4562;0.8500;0.9500;1" />
        <animate attributeName="width" dur="8s" repeatCount="indefinite"
          values="0;0;936;936;0;0" keyTimes="0;0.3750;0.4562;0.8500;0.9500;1" />
      </rect>
    </clipPath>
  </g>
  <g>
    <g clip-path="url(#typing-clip-0)" opacity="0">
      <text class="message" x="500" y="68" text-anchor="middle">我是 Feynman</text>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0813;0.8500;0.9500;1" />
    </g>
    <g clip-path="url(#typing-clip-1)" opacity="0">
      <text class="message" x="500" y="110" text-anchor="middle">Focused on LLM Inference Optimization Research</text>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.1875;0.2687;0.8500;0.9500;1" />
    </g>
    <g clip-path="url(#typing-clip-2)" opacity="0">
      <text class="message" x="500" y="152" text-anchor="middle">Transformer | PyTorch | vLLM</text>
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.3750;0.4562;0.8500;0.9500;1" />
    </g>
  </g>
  <text class="label" x="960" y="176" text-anchor="end">MODEL → FRAMEWORK → HARDWARE → OPTIMIZATION</text>
</svg>
