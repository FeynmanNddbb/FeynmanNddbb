<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="title desc">
  <title id="title">Feynman - LLM Inference Engineer</title>
  <desc id="desc">Animated introduction for Feynman's GitHub profile.</desc>
  <rect width="1000" height="180" rx="12" fill="#0d1117" />
  <style>
    text { fill: #f0f6fc; font-family: 'JetBrains Mono', 'Noto Sans SC', monospace; font-size: 25px; font-weight: 600; }
  </style>
  <g>
    <clipPath id="typing-clip-0">
      <rect x="20" y="14" width="0" height="34">
      <animate attributeName="width" dur="10s" begin="0.0s" repeatCount="indefinite"
          values="0;960;960;0;0" keyTimes="0;.12;.68;.82;1" />
      </rect>
    </clipPath>
    <clipPath id="typing-clip-1">
      <rect x="20" y="52" width="0" height="34">
      <animate attributeName="width" dur="10s" begin="2.5s" repeatCount="indefinite"
          values="0;960;960;0;0" keyTimes="0;.12;.68;.82;1" />
      </rect>
    </clipPath>
    <clipPath id="typing-clip-2">
      <rect x="20" y="90" width="0" height="34">
      <animate attributeName="width" dur="10s" begin="5.0s" repeatCount="indefinite"
          values="0;960;960;0;0" keyTimes="0;.12;.68;.82;1" />
      </rect>
    </clipPath>
  </g>
  <g>
    <g clip-path="url(#typing-clip-0)" opacity="0">
      <text x="500" y="42" text-anchor="middle">我是 Feynman，27届应届硕士生，梦想成为优秀的大模型推理工程师</text>
      <animate attributeName="opacity" dur="10s" begin="0.0s" repeatCount="indefinite"
        values="0;1;1;0;0" keyTimes="0;.12;.68;.82;1" />
    </g>
    <g clip-path="url(#typing-clip-1)" opacity="0">
      <text x="500" y="80" text-anchor="middle">LLM Inference Optimization</text>
      <animate attributeName="opacity" dur="10s" begin="2.5s" repeatCount="indefinite"
        values="0;1;1;0;0" keyTimes="0;.12;.68;.82;1" />
    </g>
    <g clip-path="url(#typing-clip-2)" opacity="0">
      <text x="500" y="118" text-anchor="middle">Transformer | PyTorch | vLLM </text>
      <animate attributeName="opacity" dur="10s" begin="5.0s" repeatCount="indefinite"
        values="0;1;1;0;0" keyTimes="0;.12;.68;.82;1" />
    </g>
  </g>
</svg>
