name: Generate typing SVG

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/typing.svg"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate SVG
        run: python scripts/generate_typing.py

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/typing.svg
          git diff --cached --quiet || git commit -m "chore: update typing SVG"
          git push